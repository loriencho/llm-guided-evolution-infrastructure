name: Submit Slurm Job

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  submit-job-to-slurm:
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Slurm connectivity
        run: |
          set -euo pipefail
          echo "HOSTNAME=$(hostname)"
          echo "SLURM_CONF=${SLURM_CONF:-<unset>}"
          which sbatch
          scontrol ping
          sinfo >/dev/null
        shell: bash
      
      - name: Create symlink for .venv
        run: |
          mkdir -p ~/scratch/.venv_runner
          ln -sfn ~/scratch/.venv_runner .venv
          ls -ld .venv
          readlink -f .venv
        shell: bash

      - name: Create symlink for .cache
        run: |
          mkdir -p ~/scratch/.cache_runner
          ln -sfn ~/scratch/.cache_runner .cache
          ls -ld .cache
          readlink -f .cache
        shell: bash

      - name: Prepare Titanic data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: | 
          export KAGGLE_API_TOKEN=$KAGGLE_KEY
          cd sota/Titanic || exit 1 
          uv run kaggle competitions list -s titanic
          if [ ! -f "data/train.csv" ]; then
            (
              chmod +x pull_data.sh
              uv run ./pull_data.sh
            )
          fi

          if [ ! -f "data/processed_train.csv" ]; then
            uv run python preprocess.py
            
          fi
        shell: bash

      - name: Start LLM server 
        run: |
          set -euo pipefail

          SERVER_JOB_NAME="LLMGE01_Server"
          SERVER_PORT="8137"
          REUSED_RUNNING_SERVER="false"

          connectivity_check() {
              # Wait for server.sh to write hostname.log.
              echo "Waiting for hostname.log..."

              for i in {1..120}; do
                if [ -s hostname.log ]; then
                  SERVER_HOSTNAME=$(cat hostname.log)
                  echo "Server hostname: $SERVER_HOSTNAME"
                  break
                fi

                echo "hostname.log not ready yet... ($i/120)"
                sleep 10
              done

              # If hostname.log was never created, the server probably failed to start
              # or is still stuck in the Slurm queue.

              if [ ! -s hostname.log ]; then
                echo "ERROR: hostname.log was not created"
                sacct -j "$SERVER_JOB_ID" --format=JobID,JobName,State,ExitCode,Elapsed
                return 1
              fi

              # Read the server hostname and construct the server URL.
              # This must match the port used in server.sh:
              # uv run uvicorn server:app --host $SERVER_HOSTNAME --port 8137

              SERVER_HOSTNAME=$(cat hostname.log)
              SERVER_URL="http://${SERVER_HOSTNAME}:8137/"

              echo "Waiting for LLM server at $SERVER_URL"

              # Wait until the server responds successfully.

              for i in {1..120}; do
                if curl -fsS --connect-timeout 5 --max-time 10 "$SERVER_URL" > /dev/null; then
                  echo "LLM server is ready"
                  break
                fi

                echo "LLM server not ready yet... ($i/120)"
                sleep 10
              done

              # Final readiness check.
              # If this fails, stop the test job instead of running tests against
              # a server that is not ready.
              curl -fsS --connect-timeout 5 --max-time 10 "$SERVER_URL" > /dev/null || {
                echo "ERROR: LLM server failed readiness check"
                sacct -j "$SERVER_JOB_ID" --format=JobID,JobName,State,ExitCode,Elapsed
                return 1
              }

              echo "LLM server verified successfully"
              cp hostname.log .cache/hostname.log
              echo "Saved hostname.log to .cache/hostname.log"
          }

          echo "Checking for existing Slurm server job named ${SERVER_JOB_NAME}..."

          # Prefer an already RUNNING server job.
          SERVER_JOB_ID=$(
            squeue -h \
              -u "$USER" \
              -n "$SERVER_JOB_NAME" \
              -t RUNNING \
              -o "%A" | head -n 1 || true
          )
          
          if [ -n "$SERVER_JOB_ID" ]; then
              echo "Found existing running server job: $SERVER_JOB_ID"
              echo "Checking .cache for hostname.log..."

              if [ -s .cache/hostname.log ]; then
                cp .cache/hostname.log hostname.log
                echo "Copied .cache/hostname.log to hostname.log"
                if ! connectivity_check; then
                  echo "Connectivity check failed for existing running job; proceeding to fallback server startup path."
                  SERVER_JOB_ID=""
                else
                  REUSED_RUNNING_SERVER="true"
                fi
                
              else
                  echo "ERROR: hostname.log not found in .cache for running server job."
                  exit 1
              fi
          fi
          
          if [ -z "$SERVER_JOB_ID" ]; then
            # Also avoid duplicate submission if another run already submitted it
            # and it is still waiting to start.
            SERVER_JOB_ID=$(
            squeue -h \
              -u "$USER" \
              -n "$SERVER_JOB_NAME" \
              -t PENDING,CONFIGURING \
              -o "%A" | head -n 1 || true
            )

            if [ -n "$SERVER_JOB_ID" ]; then
              echo "Found existing queued/starting server job: $SERVER_JOB_ID"
              echo "Will wait for this job instead of submitting server.sh again."
            else
              echo "No existing ${SERVER_JOB_NAME} job found."
              echo "Submitting new LLM server job..."

              # Only delete hostname.log when we know there is no active server job.
              # This avoids deleting the hostname file from a server that is already running.
              rm -f hostname.log

              SERVER_JOB_ID=$(sbatch --parsable server.sh)
              echo "Submitted server job: $SERVER_JOB_ID"
            fi
          fi

          if [ "$REUSED_RUNNING_SERVER" = "true" ]; then
            exit 0
          fi

          connectivity_check

        shell: bash

      - name: Submit job to Slurm
        run: |
          JOB_ID=$(sbatch --parsable slurm-submit-test.sh)
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "Submitted Slurm job: $JOB_ID"
        shell: bash

      - name: Monitor Slurm job status
        run: |
          while squeue -j "$JOB_ID" | grep -q "$JOB_ID"; do
            echo "Job $JOB_ID still running. Waiting 30 seconds..."
            sleep 30
          done
          pace-job-summary "$JOB_ID" || true
          echo "Job $JOB_ID finished."
        shell: bash

      - name: Verify job success
        run: |
          JOB_STATE=$(sacct -j "$JOB_ID" --format=State --noheader | head -n 1 | xargs)
          echo "State: $JOB_STATE"

          if [[ "$JOB_STATE" == "COMPLETED" ]]; then
            echo "Job $JOB_ID completed successfully."
          else
            echo "Job $JOB_ID failed with state: $JOB_STATE"
            exit 1
          fi
        shell: bash

      - name: "Passed tests"
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os, sys

          report = "tests/results/report.xml"
          if not os.path.exists(report):
              print("No report found."); sys.exit(0)

          passed = [
              tc.get("classname", "") + "::" + tc.get("name", "")
              for tc in ET.parse(report).getroot().iter("testcase")
              if tc.find("failure") is None and tc.find("error") is None and tc.find("skipped") is None
          ]

          print(f"Total passed: {len(passed)}\n")
          for name in passed:
              print(f"  • {name}")
          EOF
        shell: bash

      - name: "Skipped tests"
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os, sys

          report = "tests/results/report.xml"
          if not os.path.exists(report):
              print("No report found."); sys.exit(0)

          skipped = [
              (tc.get("classname", "") + "::" + tc.get("name", ""),
               tc.find("skipped").get("message", "No reason given"))
              for tc in ET.parse(report).getroot().iter("testcase")
              if tc.find("skipped") is not None
          ]

          print(f"Total skipped: {len(skipped)}\n")
          for name, reason in skipped:
              print(f"  • {name}")
              print(f"    Reason: {reason}")
          EOF
        shell: bash

      - name: "Failed tests"
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os, sys

          report = "tests/results/report.xml"
          if not os.path.exists(report):
              print("No report found."); sys.exit(0)

          failed = []
          for tc in ET.parse(report).getroot().iter("testcase"):
              name    = tc.get("classname", "") + "::" + tc.get("name", "")
              failure = tc.find("failure")
              error   = tc.find("error")
              if failure is not None or error is not None:
                  node = failure if failure is not None else error
                  failed.append((name, node.get("message", ""), (node.text or "").strip()))

          print(f"Total failed: {len(failed)}\n")

          def get_label(name):
              n = name.lower()
              if "mutat" in n:  return "✗ FAILED MUTATED INDIVIDUAL"
              if "cross" in n:  return "✗ FAILED CROSSED INDIVIDUAL"
              return                    "✗ FAILED INDIVIDUAL"

          for name, message, detail in failed:
              label = get_label(name)
              print(f"::group::{label}: {name.split('::')[-1]}")
              print(f"  Test    : {name}")
              if message:
                  print(f"  Message : {message}")
              if detail:
                  print(f"  Detail  :")
                  for line in detail.splitlines():
                      print(f"    {line}")
              print("::endgroup::")

          if failed:
              sys.exit(1)
          EOF
        shell: bash

      - name: "Benchmark results - Quality Comparison"
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os, sys

          report = "tests/results/report.xml"
          if not os.path.exists(report):
              print("No report found."); sys.exit(0)

          root = ET.parse(report).getroot()

          def print_benchmarks(benchmarks, label, id_key="gene_id"):
              print(f"::group::── {label} ({len(benchmarks)}) ──")
              print("::endgroup::")

              for entry in benchmarks:
                  pair      = entry["id"]
                  skipped   = entry["skipped"]
                  output    = entry["output"]

                  if skipped is not None:
                      print(f"::group::SKIPPED: {pair}")
                      print(f"  Reason: {skipped.get('message', 'No reason given')}")
                  else:
                      syntax_line = next((l for l in output.splitlines() if "SYNTAX" in l), None)
                      eval_line   = next((l for l in output.splitlines() if "EVAL"   in l), None)

                      print(f"::group::{pair}")
                      if syntax_line: print(f"  {syntax_line.strip()}")
                      if eval_line:   print(f"  {eval_line.strip()}")
                      if not syntax_line and not eval_line:
                          print("  No output captured (check -s flag is set in pytest)")

                  print("::endgroup::")

          # ── Collect mutation benchmarks ───────────────────────────
          mutation_benchmarks = []
          for tc in root.iter("testcase"):
              name = tc.get("name", "")
              if "mutation" not in name.lower() or "benchmark" not in name.lower():
                  continue
              gene_id = name.split("[")[-1].rstrip("]") if "[" in name else name
              stdout  = tc.find("system-out")
              mutation_benchmarks.append({
                  "id":      gene_id,
                  "skipped": tc.find("skipped"),
                  "output":  (stdout.text or "").strip() if stdout is not None else ""
              })

          # ── Collect crossover benchmarks ──────────────────────────
          crossover_benchmarks = []
          for tc in root.iter("testcase"):
              name = tc.get("name", "")
              if "crossover" not in name.lower() or "benchmark" not in name.lower():
                  continue
              pair   = name.split("[")[-1].rstrip("]") if "[" in name else name
              stdout = tc.find("system-out")
              crossover_benchmarks.append({
                  "id":      pair,
                  "skipped": tc.find("skipped"),
                  "output":  (stdout.text or "").strip() if stdout is not None else ""
              })

          # ── Print both sections ───────────────────────────────────
          print(f"Mutation benchmarks:  {len(mutation_benchmarks)}")
          print(f"Crossover benchmarks: {len(crossover_benchmarks)}\n")

          print_benchmarks(mutation_benchmarks,  "Mutation Benchmarks")
          print_benchmarks(crossover_benchmarks, "Crossover Benchmarks")
          EOF
        shell: bash

      - name: Upload XML report
        if: always()
        uses: actions/upload-artifact@v3-node20
        with:
          name: junit-report
          path: tests/results/report.xml

      - name: Run documentation suggestions
        if: always()
        run: |
          # Use github.event.before as the base SHA for pushes.
          # If it is empty or all zeros (e.g. new branch), fallback to HEAD~1 or HEAD.
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi

          echo "Analyzing changes between $BASE_SHA and $HEAD_SHA"
          python3 src/doc_checker.py "$BASE_SHA" "$HEAD_SHA"
        shell: bash

      - name: Upload doc suggestions
        if: always()
        uses: actions/upload-artifact@v3-node20
        with:
          name: doc-suggestions
          path: tests/results/doc_suggestions.json
