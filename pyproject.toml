[project]
name = "llm-guided-evolution"
version = "0.1.0"
description = "llm-guided-evolution, virtual envrionment that includes packages necessary for local llm integration & model evalution."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "ConfigSpace==0.4.21",
    "deap==1.4.3",
    "emcee",
    "flake8>=7.2.0",
    "fvcore",
    "furo>=2024.8.6",
    "gdown",
    "google-genai>=1.12.1",
    "grakel",
    "lightgbm",
    "matplotlib",
    "ngboost",
    "numpy<2.0",
    "pandas",
    "pybnn",
    "pyro-ppl",
    "pytest>=8.3.5",
    "pytorch-msssim",
    "requests",
    "scikit-image",
    "scipy",
    "seaborn",
    "sphinx>=8.2.3",
    "tensorwatch",
    "torchaudio",
    "torch",
    "tornado",
    "torchvision",
    "transformers",
    "transforms3d",
    "uvicorn",
    "fastapi",
    "pydantic",
    "tqdm",
    "hydra-core==1.3.2",
    "omegaconf",
    "pyyaml",
    "kaggle>=1.7.4.5",
    "scikit-learn>=1.7.2",
    "imblearn",
    "tensorflow>=2.20.0",
    "xgboost",
    "nasbench-pytorch",
    "nasbench301",
]

[tool.uv.sources]
nasbench-pytorch = { git = "https://github.com/romulus0914/NASBench-PyTorch", rev = "master" }
nasbench301 = { git = "https://github.com/automl/nasbench301", rev = "no_gin" }
